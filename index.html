<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Filmes</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #1a1a2e;
      color: #eee;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      background: #16213e;
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      color: #e94560;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #c23a51;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #0f3460;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .delete-btn {
      background: #ff6b6b;
      padding: 6px 12px;
      font-size: 14px;
    }

    .delete-btn:hover {
      background: #ee5253;
    }

    .status {
      text-align: center;
      font-size: 14px;
      color: #aaa;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Meus Filmes</h1>

    <div class="input-group">
      <input type="text" id="filmeInput" placeholder="Digite o nome do filme...">
      <button onclick="adicionarFilme()">Adicionar</button>
    </div>

    <p class="status" id="status">Conectando...</p>

    <ul id="listaFilmes"></ul>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      deleteDoc,
      doc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBwH8_re5BospsviqTr0QpXDNCps6kQRyg",
      authDomain: "meus-filmes-c08ba.firebaseapp.com",
      projectId: "meus-filmes-c08ba",
      storageBucket: "meus-filmes-c08ba.firebasestorage.app",
      messagingSenderId: "601793848988",
      appId: "1:601793848988:web:91c47b152f947fdb44ef59",
      measurementId: "G-7YZZYZGHQD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const statusEl = document.getElementById("status");
    const listaEl = document.getElementById("listaFilmes");
    const inputEl = document.getElementById("filmeInput");

    // Login anônimo
    signInAnonymously(auth)
      .then(() => {
        statusEl.textContent = "Conectado! Pronto para salvar filmes.";
      })
      .catch((erro) => {
        statusEl.textContent = "Erro ao conectar: " + erro.message;
      });

    // Escuta mudanças no Firestore em tempo real
    onSnapshot(collection(db, "filmes"), (snapshot) => {
      listaEl.innerHTML = "";
      snapshot.forEach((docItem) => {
        const filme = docItem.data();
        const li = document.createElement("li");
        li.innerHTML = `
          <span>${filme.nome}</span>
          <button class="delete-btn" onclick="excluirFilme('${docItem.id}')">Excluir</button>
        `;
        listaEl.appendChild(li);
      });
    });

    // Adicionar filme
    window.adicionarFilme = async function () {
      const nome = inputEl.value.trim();
      if (!nome) return;

      try {
        await addDoc(collection(db, "filmes"), {
          nome: nome,
          criadoEm: serverTimestamp()
        });
        inputEl.value = "";
      } catch (erro) {
        alert("Erro ao salvar: " + erro.message);
      }
    };

    // Excluir filme
    window.excluirFilme = async function (id) {
      try {
        await deleteDoc(doc(db, "filmes", id));
      } catch (erro) {
        alert("Erro ao excluir: " + erro.message);
      }
    };

    // Adicionar com Enter
    inputEl.addEventListener("keypress", (e) => {
      if (e.key === "Enter") adicionarFilme();
    });
  </script>
</body>
</html>
